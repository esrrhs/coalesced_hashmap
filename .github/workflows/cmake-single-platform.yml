name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: build
      run: |
        mkdir build
        cd build
        cmake ..
        make

    - name: deterministic correctness tests
      run: timeout 2m ./coalesced_hashmap_test --correctness-only
      working-directory: build

    - name: full test suite
      run: timeout 15m ./coalesced_hashmap_test
      working-directory: build
